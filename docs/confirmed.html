<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email confirmed - MoneyPaws</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0b0b19; color:#f3f4f6; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:20px; box-sizing:border-box; }
  .card { max-width:420px; width:100%; text-align:center; border:1px solid #00c2d1; border-radius:16px; padding:28px 22px; background:#111827; }
  h1 { font-size:22px; margin:8px 0 6px; color:#22d3ee; }
  p { line-height:1.6; margin:8px 0; color:#d1d5db; }
  .tl { color:#9ca3af; font-size:14px; }
  a.btn { display:block; margin-top:12px; padding:12px; border-radius:10px; text-decoration:none; font-weight:700; }
  a.main { background:#00c2d1; color:#000; }
  a.alt { border:1px solid #374151; color:#e5e7eb; }
  .paw { font-size:44px; }
</style>
</head>
<body>
  <div class="card">
    <div class="paw">🐾</div>
    <h1>Email confirmed ✅</h1>
    <p>Your MoneyPaws account is ready. Open the MoneyPaws app and log in.</p>
    <p class="tl">Na-confirm na ang email mo. Buksan ang MoneyPaws app at mag-log in.</p>
    <a class="btn main" href="https://github.com/ambionvra21-ship-it/MoneyPaws/releases/latest">Don't have the app yet? Download it</a>

</html>
