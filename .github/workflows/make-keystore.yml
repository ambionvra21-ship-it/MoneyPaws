name: Make Keystore (run once)
on: workflow_dispatch
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Create keystore
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KS_PASS" || { echo "Add the KEYSTORE_PASSWORD secret first"; exit 1; }
          keytool -genkeypair -keystore moneypaws.jks -alias moneypaws -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=MoneyPaws, O=MoneyPaws, C=PH"
          base64 -w0 moneypaws.jks > keystore.b64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          retention-days: 1
          path: |
            moneypaws.jks
            keystore.b64.txt
