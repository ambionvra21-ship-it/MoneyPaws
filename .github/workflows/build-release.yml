name: Build Release (signed AAB + APK)
on: workflow_dispatch

env:
  ADMOB_APP_ID: ca-app-pub-6655685917040449~5170056805

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moneypaws-apk-project/proj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make sure www/index.html exists
        run: |
          mkdir -p www
          F=$(grep -rl "MoneyPaws v1.0" "$GITHUB_WORKSPACE" --include='*.html' --exclude-dir=node_modules --exclude-dir=android --exclude-dir=.git --exclude-dir=docs | head -1 || true)
          if [ -n "$F" ] && [ "$F" != "$PWD/www/index.html" ]; then echo "Using: $F"; cp "$F" www/index.html; fi
          if [ ! -f www/index.html ]; then
            F=$(find "$GITHUB_WORKSPACE" -name 'index*.html' -not -path '*/node_modules/*' -not -path '*/android/*' -not -path '*/.git/*' -not -path '*/docs/*' | head -1)
            [ -n "$F" ] && { echo "Using: $F"; cp "$F" www/index.html; }
          fi
          test -f www/index.html || { echo "No index.html found anywhere in the repo"; exit 1; }
          ls -R www | head -30

      - name: Turn off AdMob test mode
        run: sed -i 's/const ADMOB_TESTING = true/const ADMOB_TESTING = false/' www/index.html

      - name: Install and sync
        run: |
          npm install
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Add AdMob App ID to manifest
        run: |
          F=android/app/src/main/AndroidManifest.xml
          grep -q 'ads.APPLICATION_ID' $F || sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/></application>#" $F
          grep -q POST_NOTIFICATIONS $F || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application#' $F

      - name: Set up signing
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KS_B64" || { echo "Add the KEYSTORE_BASE64 secret first"; exit 1; }
          echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/moneypaws.jks"
          cat >> android/app/build.gradle <<'EOF2'

          android {
              defaultConfig {
                  versionCode ${{ github.run_number }}
                  versionName "1.0.${{ github.run_number }}"
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv('KS_FILE'))
                      storePassword System.getenv('KS_PASS')
                      keyAlias 'moneypaws'
                      keyPassword System.getenv('KS_PASS')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF2

      - name: Build release
        working-directory: moneypaws-apk-project/proj/android
        env:
          KS_FILE: ${{ github.workspace }}/moneypaws.jks
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: moneypaws-release
          path: |
            moneypaws-apk-project/proj/android/app/build/outputs/bundle/release/app-release.aab
            moneypaws-apk-project/proj/android/app/build/outputs/apk/release/app-release.apk
