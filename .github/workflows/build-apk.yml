name: Build Debug APK
on:
  push:
  workflow_dispatch:

env:
  # Google's TEST app ID. Replace with YOUR AdMob App ID (it contains a "~"), e.g. ca-app-pub-6655685917040449~xxxxxxxxxx
  ADMOB_APP_ID: ca-app-pub-6655685917040449~5170056805

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moneypaws-apk-project/proj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make sure www/index.html exists
        run: |
          mkdir -p www
          F=$(grep -rl "MoneyPaws v1.0" "$GITHUB_WORKSPACE" --include='*.html' --exclude-dir=node_modules --exclude-dir=android --exclude-dir=.git --exclude-dir=docs | head -1 || true)
          if [ -n "$F" ] && [ "$F" != "$PWD/www/index.html" ]; then echo "Using: $F"; cp "$F" www/index.html; fi
          if [ ! -f www/index.html ]; then
            F=$(find "$GITHUB_WORKSPACE" -name 'index*.html' -not -path '*/node_modules/*' -not -path '*/android/*' -not -path '*/.git/*' -not -path '*/docs/*' | head -1)
            [ -n "$F" ] && { echo "Using: $F"; cp "$F" www/index.html; }
          fi
          test -f www/index.html || { echo "No index.html found anywhere in the repo"; exit 1; }
          ls -R www | head -30

      - name: Install and sync
        run: |
          npm install
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Add AdMob App ID and permissions
        run: |
          F=android/app/src/main/AndroidManifest.xml
          V=android/app/src/main/res/values/strings.xml
          # AdMob app ID as a string resource (read by the Capacitor 8 AdMob plugin)
          grep -q admob_app_id $V || sed -i "s#</resources>#    <string name=\"admob_app_id\">$ADMOB_APP_ID</string>\n</resources>#" $V
          # also declare it in the manifest; tools:replace avoids a duplicate-entry error if the plugin declares it too
          grep -q 'xmlns:tools' $F || sed -i 's#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' $F
          grep -q 'ads.APPLICATION_ID' $F || sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\" tools:replace=\"android:value\"/></application>#" $F
          grep -q POST_NOTIFICATIONS $F || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application#' $F
          echo "--- manifest check ---"; grep -n "APPLICATION_ID\|POST_NOTIFICATIONS\|xmlns:tools" $F | cut -c1-150; grep -n admob_app_id $V

      - name: Build Debug APK
        working-directory: moneypaws-apk-project/proj/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: moneypaws-debug-apk
          path: moneypaws-apk-project/proj/android/app/build/outputs/apk/debug/app-debug.apk
