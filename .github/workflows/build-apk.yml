name: Build Debug APK
on:
  push:
  workflow_dispatch:

env:
  # Google's TEST app ID. Replace with YOUR AdMob App ID (it contains a "~"), e.g. ca-app-pub-6655685917040449~xxxxxxxxxx
  ADMOB_APP_ID: ca-app-pub-6655685917040449~5170056805

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moneypaws-apk-project/proj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install and sync
        run: |
          npm install
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Add AdMob App ID to manifest
        run: |
          F=android/app/src/main/AndroidManifest.xml
          grep -q 'ads.APPLICATION_ID' $F || sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/></application>#" $F
          grep -q POST_NOTIFICATIONS $F || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application#' $F

      - name: Build Debug APK
        working-directory: moneypaws-apk-project/proj/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: moneypaws-debug-apk
          path: moneypaws-apk-project/proj/android/app/build/outputs/apk/debug/app-debug.apk
